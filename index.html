<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>가격검색</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--line:#dfe7e5;--text:#14201d;--muted:#66736f;--green:#0f766e;--blue:#2563eb;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--text);padding-bottom:78px}
button,input,select{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,#0b6f63,#0f766e);color:#fff;padding:9px 10px;box-shadow:0 2px 10px rgba(0,0,0,.13)}
.headerInner{max-width:860px;margin:auto;display:grid;grid-template-columns:1fr 100px 66px;gap:7px;align-items:center}
.logo{font-size:20px;font-weight:900;white-space:nowrap}
#storeSelect,#syncBtn{height:36px;border-radius:999px;font-size:12px}
#storeSelect{width:100px;border:1px solid rgba(255,255,255,.45);background:#fff;padding:0 7px}
#syncBtn{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.16);color:#fff;font-weight:900}
.container{max-width:860px;margin:auto;padding:9px}
.status{font-size:12px;color:var(--muted);margin:2px 2px 9px;line-height:1.45}
.panel,.searchBox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.modeSwitch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modeSwitch button{height:47px;border-radius:15px;border:1px solid var(--line);background:#f8faf9;color:#34413d;font-weight:900}
.modeSwitch button.active{background:var(--green);color:#fff;border-color:var(--green)}
.hidden{display:none!important}
.todayLabel{text-align:center;color:var(--green);font-size:12px;font-weight:900;margin:2px 0 12px}
.title{font-size:17px;font-weight:900;margin-bottom:5px}.sub{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.boxGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.boxBtn{min-height:56px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:18px;font-weight:900;color:#17211f;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.boxBtn:active{background:var(--green);color:#fff}
.secondaryBtn{width:100%;height:42px;border-radius:14px;border:1px solid var(--line);background:#f8faf9;font-weight:900;margin-top:11px}
.workHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.backBtn{height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:900;padding:0 12px}
.workMeta{text-align:right}.workMeta b{font-size:17px}.workMeta div{font-size:12px;color:var(--muted);margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.name{font-size:17px;font-weight:900;line-height:1.4;margin-bottom:7px}.price{font-size:23px;font-weight:950;line-height:1.3}.price.multi{color:var(--red)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;background:#e8f7f3;color:#0b6f63}.badge.warn{background:#fff4d6;color:#925700}.badge.red{background:#ffe4e6;color:#b91c1c}
.priceRaw{margin-top:8px;padding:10px;border-radius:12px;background:#fff8e8;border:1px solid #f5dfaa;white-space:pre-wrap;line-height:1.65;font-size:13px}
.detailBtn{width:100%;height:38px;margin-top:9px;border:1px solid var(--line);border-radius:12px;background:#f8faf9;font-weight:900}
.detailBox{margin-top:8px;padding:10px;border-radius:12px;background:#f8faf9;font-size:12px;line-height:1.7;color:#485650;white-space:pre-wrap}
.searchRow{display:grid;grid-template-columns:108px 1fr 68px;gap:7px}
.searchRow select,.searchRow input{height:46px;border:1px solid #ccd7d4;border-radius:14px;background:#fff;padding:0 10px;font-size:15px;outline:none}.searchRow input:focus{border-color:var(--green)}
.clearBtn{border:0;border-radius:14px;background:#17211f;color:#fff;font-weight:900}
.actionRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.actionRow button{min-height:42px;border-radius:13px;font-weight:900}.detailSearchBtn{background:#f8faf9;border:1px solid var(--line)}.downloadBtn{background:var(--blue);color:#fff;border:0;font-size:12px;line-height:1.25;padding:6px}
.quickRow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.quickRow button{height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:900}.quickRow button.active{background:var(--green);color:#fff;border-color:var(--green)}
.dateGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.dateGrid label{display:block;font-size:11px;color:var(--muted);font-weight:900;margin:0 0 4px 2px}.dateGrid input{height:43px;width:100%;border:1px solid #ccd7d4;border-radius:12px;padding:0 9px}
.chips{display:flex;gap:7px;overflow:auto;padding:0 0 9px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:900;color:#3d4945}.chip.active{background:#17211f;color:#fff;border-color:#17211f}
.count{font-size:13px;color:#47544f;margin:3px 2px 9px}.empty{background:#fff;border:1px dashed #cbd5d1;border-radius:17px;padding:22px;color:#66736f;line-height:1.7}
.expiryEdit{display:grid;grid-template-columns:1fr 76px;gap:6px;margin-top:10px}.expiryEdit input{height:38px;border:1px solid #ccd7d4;border-radius:11px;padding:0 8px}.expiryEdit button{border:0;border-radius:11px;background:var(--green);color:#fff;font-weight:900}
.exceptionBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}.exceptionBtns button{height:36px;border:0;border-radius:11px;color:#fff;font-size:12px;font-weight:900}.manufacture{background:#f59e0b}.exclude{background:#6b7280}.expiry{background:#2563eb}
.bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bottomInner{max-width:860px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.navBtn{height:50px;border:0;background:transparent;border-radius:12px;color:#5f6d69;font-size:11px;font-weight:900}.navBtn span{display:block;font-size:20px;line-height:1.05}.navBtn.active{color:var(--green);background:#ecf8f5}
@media(max-width:430px){.headerInner{grid-template-columns:1fr 94px 62px}.logo{font-size:19px}#storeSelect{width:94px}.boxGrid{grid-template-columns:repeat(3,1fr)}.searchRow{grid-template-columns:100px 1fr 64px}}
</style>
</head>
<body>
<header class="header"><div class="headerInner">
  <div class="logo">가격검색</div>
  <select id="storeSelect"></select>
  <button id="syncBtn" onclick="syncData()">동기화</button>
</div></header>

<main class="container">
  <div id="status" class="status">데이터 불러오는 중...</div>

  <section class="panel"><div class="modeSwitch">
    <button id="workTop" class="active" onclick="setMainMode('work')">작업모드</button>
    <button id="searchTop" onclick="setMainMode('search')">검색모드</button>
  </div></section>

  <section id="workHome">
    <div class="panel">
      <div id="workDate" class="todayLabel"></div>
      <div class="title">박스번호를 선택하세요</div>
      <div class="sub">숫자 한 번만 누르면 상품명과 가격이 바로 표시됩니다.</div>
      <div id="boxGrid" class="boxGrid"></div>
      <button class="secondaryBtn" onclick="showRecentBox()">최근 본 박스</button>
    </div>
  </section>

  <section id="workList" class="hidden">
    <div class="workHead">
      <button class="backBtn" onclick="backToBoxes()">← 박스 선택</button>
      <div class="workMeta"><b id="boxTitle"></b><div id="boxCount"></div></div>
    </div>
    <div id="workResults"></div>
  </section>

  <section id="searchArea" class="hidden">
    <div class="searchBox">
      <div class="searchRow">
        <select id="searchModeSelect" onchange="setSearchMode(this.value)">
          <option value="product">상품명</option><option value="box">박스번호</option>
        </select>
        <input id="q" type="search" placeholder="상품명을 입력하세요" autocomplete="off">
        <button class="clearBtn" onclick="clearSearch()">초기화</button>
      </div>
      <div class="actionRow">
        <button class="detailSearchBtn" id="detailToggleBtn" onclick="toggleDetail()">세부검색 펼치기</button>
        <button class="downloadBtn" onclick="downloadExcel()">가격 인하 요청서 엑셀 다운로드</button>
      </div>
      <div id="detailArea" class="hidden">
        <div class="quickRow">
          <button id="allBtn" class="active" onclick="setQuickDate('all')">전체</button>
          <button id="todayBtn" onclick="setQuickDate('today')">오늘</button>
          <button id="yesterdayBtn" onclick="setQuickDate('yesterday')">어제</button>
          <button id="recentBtn" onclick="setQuickDate('recent7')">최근7일</button>
        </div>
        <div class="dateGrid">
          <div><label>시작 입고일</label><input id="dateStart" type="date"></div>
          <div><label>종료 입고일</label><input id="dateEnd" type="date"></div>
        </div>
      </div>
    </div>
    <div class="chips">
      <button class="chip active" data-menu="전체상품">전체</button>
      <button class="chip" data-menu="유통기한관리">유통기한</button>
      <button class="chip" data-menu="만료">만료</button>
      <button class="chip" data-menu="7일이내">7일</button>
      <button class="chip" data-menu="30일이내">30일</button>
      <button class="chip" data-menu="60일이내">2개월</button>
      <button class="chip" data-menu="90일이내">3개월</button>
      <button class="chip" data-menu="장기재고">장기</button>
      <button class="chip" data-menu="기한확인필요">기한확인</button>
      <button class="chip" data-menu="비관리대상">비관리</button>
    </div>
    <div id="count" class="count"></div><div id="results"></div>
  </section>
</main>

<nav class="bottomNav"><div class="bottomInner">
  <button id="navWork" class="navBtn active" onclick="setMainMode('work')"><span>⌂</span>작업</button>
  <button id="navSearch" class="navBtn" onclick="setMainMode('search')"><span>⌕</span>검색</button>
  <button class="navBtn" onclick="downloadExcel()"><span>⇩</span>다운로드</button>
  <button class="navBtn" onclick="syncData()"><span>↻</span>동기화</button>
</div></nav>

<script>
const STORES=["영등포","서원","양재","당산","상계","수서","가양","석촌","강남","마곡","신대방3","가락","먹골","흑석","노원","녹번","왕십리","부평","하계","평택안중","대구","수원","갈산","답십리","선유도","석계","성남태평","인천논현","구로구청"];
let RAW_DATA=[],DATA=[],META={},STORE_OVERRIDES={},mainMode="work",searchMode="product",currentMenu="전체상품",timer=null,visibleLimit=150,currentWorkDate="";
function pad(n){return String(n).padStart(2,"0")}function dateStr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function today(){return dateStr(new Date())}
function yesterday(){let d=new Date();d.setDate(d.getDate()-1);return dateStr(d)}function recent7(){let d=new Date();d.setDate(d.getDate()-6);return dateStr(d)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function norm(s){return String(s??"").toLowerCase().trim()}function won(n){return (!n||isNaN(n))?"":Number(n).toLocaleString()+"원"}
function getStore(){return localStorage.getItem("selectedStore")||""}
function initStore(){const s=document.getElementById("storeSelect");s.innerHTML='<option value="">지점 선택</option>'+STORES.map(x=>`<option value="${x}">${x}</option>`).join("");s.value=getStore();s.onchange=()=>{localStorage.setItem("selectedStore",s.value);loadOverrides().then(()=>{updateStatus();renderBoxes();search()})}}
function updateStatus(){document.getElementById("status").innerHTML=`업데이트 <b>${esc(META.updatedAt||"-")}</b> · 상품 <b>${(META.count||RAW_DATA.length).toLocaleString()}</b>개 · 내 매장 <b>${esc(getStore()||"미선택")}</b>`}
async function loadOverrides(){STORE_OVERRIDES={};const store=getStore();if(!store){DATA=RAW_DATA.slice();return}try{const r=await fetch(`/store_overrides/${encodeURIComponent(store)}?ts=`+Date.now()),j=await r.json();if(j.ok)STORE_OVERRIDES=j.overrides||{}}catch(e){}DATA=RAW_DATA.map(item=>{const o=STORE_OVERRIDES[item.itemKey];if(!o)return item;const x={...item,storeOverride:true};if(o.expiryDate)x.expiryDate=o.expiryDate;return x})}
function setMainMode(mode){mainMode=mode;const w=mode==="work";document.getElementById("workHome").classList.toggle("hidden",!w);document.getElementById("workList").classList.add("hidden");document.getElementById("searchArea").classList.toggle("hidden",w);document.getElementById("workTop").classList.toggle("active",w);document.getElementById("searchTop").classList.toggle("active",!w);document.getElementById("navWork").classList.toggle("active",w);document.getElementById("navSearch").classList.toggle("active",!w);if(w)renderBoxes();else search()}
function latestInboundDate(){const dates=DATA.map(x=>x.inboundDate).filter(Boolean).sort();return dates.length?dates[dates.length-1]:""}
function workRows(){const t=today(),todayRows=DATA.filter(x=>x.inboundDate===t);currentWorkDate=todayRows.length?t:latestInboundDate();return DATA.filter(x=>x.inboundDate===currentWorkDate)}
function renderBoxes(){const rows=workRows();document.getElementById("workDate").innerText=currentWorkDate?`${currentWorkDate} 가격리스트`:"입고 데이터 없음";const nums=[...new Set(rows.map(x=>String(x.boxNo||"").trim()).filter(Boolean))].sort((a,b)=>(Number(a)||999999)-(Number(b)||999999)||a.localeCompare(b));document.getElementById("boxGrid").innerHTML=nums.length?nums.map(n=>`<button class="boxBtn" onclick="openBox('${esc(n)}')">${esc(n)}</button>`).join(""):'<div class="empty" style="grid-column:1/-1">표시할 박스번호가 없습니다.</div>'}
function openBox(n){let recent=JSON.parse(localStorage.getItem("recentBoxes")||"[]").filter(x=>x!==n);recent.unshift(n);localStorage.setItem("recentBoxes",JSON.stringify(recent.slice(0,8)));const rows=workRows().filter(x=>String(x.boxNo||"").trim()===n);document.getElementById("workHome").classList.add("hidden");document.getElementById("workList").classList.remove("hidden");document.getElementById("boxTitle").innerText=`${n}번 박스`;document.getElementById("boxCount").innerText=`총 ${rows.length}개 상품`;renderWork(rows)}
function showRecentBox(){const a=JSON.parse(localStorage.getItem("recentBoxes")||"[]");if(!a.length)return alert("최근 본 박스가 없습니다.");openBox(a[0])}
function backToBoxes(){document.getElementById("workList").classList.add("hidden");document.getElementById("workHome").classList.remove("hidden")}
function priceText(i){return i.priceDisplay||(i.price?won(i.price):(i.priceBand||"가격 정보 없음"))}
function renderWork(rows){const root=document.getElementById("workResults");if(!rows.length){root.innerHTML='<div class="empty">상품이 없습니다.</div>';return}root.innerHTML=rows.map((i,k)=>{const multi=i.showPriceDetail||["multiple","discretion","range"].includes(i.priceType);return `<article class="card"><div class="name">${esc(i.product||"상품명 없음")}</div><div class="price ${multi?'multi':''}">${esc(priceText(i))}</div><div class="badges">${i.expiryDate?`<span class="badge ${Number(i.daysLeft)<=30?'warn':''}">유통기한 ${esc(i.expiryDate)}</span>`:""}${multi?'<span class="badge red">복합가격</span>':""}</div>${multi&&i.priceRaw?`<div class="priceRaw">${esc(i.priceRaw)}</div>`:""}<button class="detailBtn" onclick="document.getElementById('wd${k}').classList.toggle('hidden')">자세히 보기</button><div id="wd${k}" class="detailBox hidden">입고일: ${esc(i.inboundDate||"-")}
박스번호: ${esc(i.boxNo||"-")}
분류: ${esc(i.category||"-")}
바코드: ${esc(i.barcode||"-")}
배분매장: ${esc(i.store||"-")}
비고: ${esc(i.note||"-")}</div></article>`}).join("")}
function setSearchMode(m){searchMode=m;const q=document.getElementById("q");q.value="";q.inputMode=m==="box"?"numeric":"text";q.placeholder=m==="box"?"박스번호를 입력하세요":"상품명을 입력하세요";search()}
function toggleDetail(){const a=document.getElementById("detailArea"),b=document.getElementById("detailToggleBtn");a.classList.toggle("hidden");b.innerText=a.classList.contains("hidden")?"세부검색 펼치기":"세부검색 접기"}
function activeQuick(id){["allBtn","todayBtn","yesterdayBtn","recentBtn"].forEach(x=>document.getElementById(x).classList.remove("active"));if(id)document.getElementById(id).classList.add("active")}
function setQuickDate(t){const s=document.getElementById("dateStart"),e=document.getElementById("dateEnd");visibleLimit=150;if(t==="all"){s.value="";e.value="";activeQuick("allBtn")}if(t==="today"){s.value=today();e.value=today();activeQuick("todayBtn")}if(t==="yesterday"){s.value=yesterday();e.value=yesterday();activeQuick("yesterdayBtn")}if(t==="recent7"){s.value=recent7();e.value=today();activeQuick("recentBtn")}search()}
function clearSearch(){document.getElementById("q").value="";document.getElementById("dateStart").value="";document.getElementById("dateEnd").value="";currentMenu="전체상품";visibleLimit=150;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.dataset.menu==="전체상품"));activeQuick("allBtn");search()}
function passMenu(i){if(currentMenu==="전체상품")return true;if(currentMenu==="유통기한관리")return i.manage==="유통기한관리";if(currentMenu==="기한확인필요")return i.manage==="기한확인필요";if(currentMenu==="비관리대상")return i.manage==="비관리대상";return i.section===currentMenu}
function scheduleSearch(){clearTimeout(timer);timer=setTimeout(search,180)}
function search(){const raw=document.getElementById("q").value.trim(),q=norm(raw),s=document.getElementById("dateStart").value,e=document.getElementById("dateEnd").value;let rows=DATA.filter(passMenu);if(s)rows=rows.filter(x=>(x.inboundDate||"")>=s);if(e)rows=rows.filter(x=>(x.inboundDate||"")<=e);if(searchMode==="box"){if(raw)rows=rows.filter(x=>String(x.boxNo||"").trim()===raw)}else{const ts=q.split(/\s+/).filter(Boolean);if(ts.length)rows=rows.filter(x=>ts.every(t=>norm(x.search||"").includes(t)))}renderSearch(rows)}
function renderSearch(rows){document.getElementById("count").innerHTML=`검색 결과 <b>${rows.length.toLocaleString()}</b>건`;const root=document.getElementById("results");if(!rows.length){root.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}root.innerHTML=rows.slice(0,visibleLimit).map((i,k)=>`<article class="card"><div class="name">${esc(i.product||"")}</div><div class="price">${esc(priceText(i))}</div><div class="badges"><span class="badge">${esc(i.inboundDate||"-")}</span><span class="badge">박스 ${esc(i.boxNo||"-")}</span>${i.expiryDate?`<span class="badge warn">${esc(i.expiryDate)}</span>`:""}</div>${i.showPriceDetail&&i.priceRaw?`<div class="priceRaw">${esc(i.priceRaw)}</div>`:""}<div class="expiryEdit"><input id="ex${k}" type="date" value="${esc(i.expiryDate||"")}"><button onclick="saveExpiry('${encodeURIComponent(i.itemKey)}','ex${k}')">저장</button></div><div class="exceptionBtns"><button class="manufacture" onclick="setException('${encodeURIComponent(i.itemKey)}','manufacture')">제조일</button><button class="exclude" onclick="setException('${encodeURIComponent(i.itemKey)}','exclude')">관리제외</button><button class="expiry" onclick="setException('${encodeURIComponent(i.itemKey)}','expiry')">유통기한</button></div></article>`).join("");if(rows.length>visibleLimit)root.insertAdjacentHTML("beforeend",'<button class="secondaryBtn" onclick="visibleLimit+=150;search()">더보기</button>')}
async function saveExpiry(key,id){const store=getStore();if(!store)return alert("상단에서 내 매장을 선택해 주세요.");const value=document.getElementById(id).value;if(!value)return alert("유통기한을 선택해 주세요.");const r=await fetch(`/set_store_item_expiry/${key}/${encodeURIComponent(store)}/${value}?ts=`+Date.now()),j=await r.json();if(!j.ok)return alert(j.message||"저장 실패");await loadData({autoRecover:false});alert("저장 완료")}
async function setException(key,mode){const store=getStore();if(!store)return alert("상단에서 내 매장을 선택해 주세요.");const r=await fetch(`/set_item_exception/STORE%7C${encodeURIComponent(store)}%7C${key}/${mode}?ts=`+Date.now()),j=await r.json();if(!j.ok)return alert(j.message||"설정 실패");await loadData({autoRecover:false});alert("설정 완료")}
function downloadExcel(){const p=new URLSearchParams({mode:searchMode,q:document.getElementById("q").value||"",start:document.getElementById("dateStart").value||"",end:document.getElementById("dateEnd").value||"",menu:currentMenu,store:getStore()});location.href="/download_excel?"+p}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function fetchData(){const r=await fetch("search_data.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(`데이터 요청 실패 (${r.status})`);const d=await r.json();if(!d||!Array.isArray(d.items))throw new Error("데이터 형식 오류");return d}
async function loadData(opt={}){let err;for(let n=1;n<=3;n++){try{if(n>1)document.getElementById("status").innerHTML=`서버 준비 중... ${n}/3`;const d=await fetchData();META=d;RAW_DATA=d.items||[];await loadOverrides();updateStatus();renderBoxes();search();return true}catch(e){err=e;if(n<3)await sleep(n*1000)}}if(opt.autoRecover!==false){const ok=await syncData({silent:true,reloadAfter:false});if(ok)return loadData({autoRecover:false})}document.getElementById("status").innerHTML=`데이터 불러오기 실패: ${esc(err?.message||"오류")}`;return false}
async function syncData(opt={}){const b=document.getElementById("syncBtn");b.disabled=true;b.innerText="동기화중";try{const r=await fetch("/sync?ts="+Date.now(),{cache:"no-store"}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||"동기화 실패");localStorage.setItem("lastSuccessfulSyncDate",today());if(opt.reloadAfter!==false)await loadData({autoRecover:false});return true}catch(e){if(!opt.silent)alert(e.message||String(e));return false}finally{b.disabled=false;b.innerText="동기화"}}
async function start(){initStore();if((localStorage.getItem("lastSuccessfulSyncDate")||"")!==today())await syncData({silent:true,reloadAfter:false});await loadData()}
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");currentMenu=c.dataset.menu;visibleLimit=150;search()});
document.getElementById("q").addEventListener("input",scheduleSearch);document.getElementById("dateStart").onchange=()=>{activeQuick(null);search()};document.getElementById("dateEnd").onchange=()=>{activeQuick(null);search()};start();
</script>
</body></html>
