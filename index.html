<!doctype html>
<html lang="ko">
<head>

<title>가격검색</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--line:#dfe7e5;--text:#14201d;--muted:#66736f;--green:#0f766e;--blue:#2563eb;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--text);padding-bottom:78px}
button,input,select{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,#0b6f63,#0f766e);color:#fff;padding:9px 10px;box-shadow:0 2px 10px rgba(0,0,0,.13)}
.headerInner{max-width:860px;margin:auto;display:grid;grid-template-columns:1fr 100px 66px;gap:7px;align-items:center}
.logo{font-size:20px;font-weight:900;white-space:nowrap}
#storeSelect,#syncBtn{height:36px;border-radius:999px;font-size:12px}
#storeSelect{width:100px;border:1px solid rgba(255,255,255,.45);background:#fff;padding:0 7px}
#syncBtn{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.16);color:#fff;font-weight:900}
.container{max-width:860px;margin:auto;padding:9px}
.status{font-size:12px;color:var(--muted);margin:2px 2px 9px;line-height:1.45}
.networkBar{display:flex;align-items:center;gap:8px;min-height:38px;margin:0 0 9px;padding:8px 10px;border-radius:13px;border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;font-size:12px;font-weight:800}
.networkBar.offline{border-color:#fed7aa;background:#fff7ed;color:#9a3412}
.networkBar.unstable{border-color:#fde68a;background:#fffbeb;color:#92400e}
.networkDot{width:9px;height:9px;border-radius:50%;background:#16a34a;flex:0 0 auto}
.networkBar.offline .networkDot{background:#ea580c}.networkBar.unstable .networkDot{background:#d97706}
.networkText{flex:1;line-height:1.35}.networkAction{height:28px;border:1px solid currentColor;border-radius:9px;background:transparent;color:inherit;padding:0 8px;font-size:11px;font-weight:900}
.offlineLock{opacity:.55;pointer-events:none}

.panel,.searchBox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.modeSwitch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modeSwitch button{height:47px;border-radius:15px;border:1px solid var(--line);background:#f8faf9;color:#34413d;font-weight:900}
.modeSwitch button.active{background:var(--green);color:#fff;border-color:var(--green)}
.hidden{display:none!important}
.workDateRow{display:grid;grid-template-columns:1fr 66px;gap:8px;align-items:end;margin-bottom:8px}.workDateField label{display:block;font-size:11px;color:var(--muted);font-weight:900;margin:0 0 4px 2px}.workDateField select{width:100%;height:44px;border:2px solid #cbd8d4;border-radius:13px;background:#fff;padding:0 10px;font-size:15px;font-weight:800;color:#17211f;outline:none}.workDateField select:focus{border-color:var(--green)}.todayWorkBtn{height:44px;border:0;border-radius:13px;background:#e8f7f3;color:#0b6f63;font-weight:900}.todayLabel{text-align:center;color:var(--green);font-size:12px;font-weight:900;margin:2px 0 12px}
.title{font-size:17px;font-weight:900;margin-bottom:5px}.sub{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.boxJump{display:block;margin-bottom:11px}.boxJump input{height:46px;border:2px solid #cbd8d4;border-radius:14px;padding:0 12px;font-size:17px;outline:none}.boxJump input:focus{border-color:var(--green)}.boxJump button{border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:900}.boxGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.boxBtn{position:relative;min-height:61px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:18px;font-weight:900;color:#17211f;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.boxBtn:active{background:var(--green);color:#fff}
.boxBtn.completed{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 9px rgba(15,118,110,.23)}
.boxDoneMark{font-size:10px;font-weight:900;line-height:1.1}
.workProgress{margin:0 0 12px;padding:11px 12px;border:1px solid #cfe2dc;border-radius:14px;background:#f5fbf9}
.workProgressTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.workProgressText{font-size:13px;font-weight:900;color:#0b6f63}
.resetCompleteBtn{height:30px;border:1px solid #b9d6ce;border-radius:9px;background:#fff;color:#53645f;padding:0 8px;font-size:10px;font-weight:900}
.progressTrack{height:7px;margin-top:8px;border-radius:999px;background:#dcebe7;overflow:hidden}
.progressFill{height:100%;width:0;background:var(--green);border-radius:999px;transition:width .2s ease}
.secondaryBtn{width:100%;height:42px;border-radius:14px;border:1px solid var(--line);background:#f8faf9;font-weight:900;margin-top:11px}
.workHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.backBtn{height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:900;padding:0 12px}
.workMeta{text-align:right}.workMeta b{font-size:17px}.workMeta div{font-size:12px;color:var(--muted);margin-top:3px}
.boxCompleteBtn{width:100%;min-height:46px;margin-bottom:10px;border:2px solid var(--green);border-radius:14px;background:#fff;color:var(--green);font-size:14px;font-weight:950}
.boxCompleteBtn.completed{background:var(--green);color:#fff}
.boxCompleteBtn:disabled{border-color:#cbd5d1;background:#f3f5f4;color:#8a9692}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.name{font-size:17px;font-weight:900;line-height:1.4;margin-bottom:7px}.price{font-size:23px;font-weight:950;line-height:1.3}.price.multi{color:var(--red)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;background:#e8f7f3;color:#0b6f63}.badge.warn{background:#fff4d6;color:#925700}.badge.red{background:#ffe4e6;color:#b91c1c}

.searchRow{display:grid;grid-template-columns:108px 1fr 68px;gap:7px}
.searchRow select,.searchRow input{height:46px;border:1px solid #ccd7d4;border-radius:14px;background:#fff;padding:0 10px;font-size:15px;outline:none}.searchRow input:focus{border-color:var(--green)}
.clearBtn{border:0;border-radius:14px;background:#17211f;color:#fff;font-weight:900}
.actionRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.actionRow button{min-height:42px;border-radius:13px;font-weight:900}.detailSearchBtn{background:#f8faf9;border:1px solid var(--line)}.downloadBtn{background:var(--blue);color:#fff;border:0;font-size:12px;line-height:1.25;padding:6px}
.quickRow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.quickRow button{height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:900}.quickRow button.active{background:var(--green);color:#fff;border-color:var(--green)}
.dateGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.dateGrid label{display:block;font-size:11px;color:var(--muted);font-weight:900;margin:0 0 4px 2px}.dateGrid input{height:43px;width:100%;border:1px solid #ccd7d4;border-radius:12px;padding:0 9px}
.chips{display:flex;gap:7px;overflow:auto;padding:0 0 9px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:900;color:#3d4945}.chip.active{background:#17211f;color:#fff;border-color:#17211f}
.smartHint{margin-top:8px;padding:8px 10px;border-radius:12px;background:#eef7ff;color:#1d4ed8;font-size:12px;line-height:1.45}.scoreBadge{display:inline-flex;margin-left:6px;padding:3px 7px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:10px;font-weight:900}.count{font-size:13px;color:#47544f;margin:3px 2px 9px}.empty{background:#fff;border:1px dashed #cbd5d1;border-radius:17px;padding:22px;color:#66736f;line-height:1.7}
.expiryEdit{display:grid;grid-template-columns:1fr 76px;gap:6px;margin-top:10px}.expiryEdit input{height:38px;border:1px solid #ccd7d4;border-radius:11px;padding:0 8px}.expiryEdit button{border:0;border-radius:11px;background:var(--green);color:#fff;font-weight:900}
.exceptionBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}.exceptionBtns button{height:36px;border:0;border-radius:11px;color:#fff;font-size:12px;font-weight:900}.manufacture{background:#f59e0b}.exclude{background:#6b7280}.expiry{background:#2563eb}
.bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bottomInner{max-width:860px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.navBtn{height:50px;border:0;background:transparent;border-radius:12px;color:#5f6d69;font-size:11px;font-weight:900}.navBtn span{display:block;font-size:20px;line-height:1.05}.navBtn.active{color:var(--green);background:#ecf8f5}
@media(max-width:430px){.workDateRow{grid-template-columns:1fr 62px}.headerInner{grid-template-columns:1fr 94px 62px}.logo{font-size:19px}#storeSelect{width:94px}.boxGrid{grid-template-columns:repeat(3,1fr)}.searchRow{grid-template-columns:100px 1fr 64px}}
</style>
</head>
<body>
<header class="header"><div class="headerInner">
  <div class="logo">가격검색</div>
  <select id="storeSelect"></select>
  <button id="syncBtn" onclick="syncData()">동기화</button>
</div></header>

<main class="container">
  <div id="networkBar" class="networkBar">
    <span class="networkDot"></span>
    <span id="networkText" class="networkText">연결 상태 확인 중...</span>
    <button id="clearCacheBtn" class="networkAction" onclick="clearOfflineData()">저장자료 삭제</button>
  </div>
  <div id="status" class="status">데이터 불러오는 중...</div>

  <section class="panel"><div class="modeSwitch">
    <button id="workTop" class="active" onclick="setMainMode('work')">작업모드</button>
    <button id="searchTop" onclick="setMainMode('search')">검색모드</button>
  </div></section>

  <section id="workHome">
    <div class="panel">
      <div class="workDateRow">
        <div class="workDateField">
          <label for="workDateSelect">가격리스트 날짜</label>
          <select id="workDateSelect" onchange="changeWorkDate(this.value)"></select>
        </div>
        <button class="todayWorkBtn" onclick="selectTodayWorkDate()">오늘</button>
      </div>
      <div id="workDate" class="todayLabel"></div>
      <div class="workProgress">
        <div class="workProgressTop">
          <div id="workProgressText" class="workProgressText">완료 0 / 0박스</div>
          <button class="resetCompleteBtn" onclick="resetCompletedBoxes()">완료표시 초기화</button>
        </div>
        <div class="progressTrack"><div id="workProgressFill" class="progressFill"></div></div>
      </div>
      <div class="title">박스번호를 선택하세요</div>
      <div class="sub">박스번호를 누르거나 직접 입력하면 상품명과 가격이 바로 표시됩니다.</div>
      <div class="boxJump">
        <input id="workBoxInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="박스번호 입력 시 자동 이동">
      </div>
      <div id="boxGrid" class="boxGrid"></div>
      <button class="secondaryBtn" onclick="showRecentBox()">최근 본 박스</button>
    </div>
  </section>

  <section id="workList" class="hidden">
    <div class="workHead">
      <button class="backBtn" onclick="backToBoxes()">← 박스 선택</button>
      <div class="workMeta"><b id="boxTitle"></b><div id="boxCount"></div></div>
    </div>
    <button id="boxCompleteBtn" class="boxCompleteBtn" onclick="toggleCurrentBoxComplete()">✓ 이 박스 작업 완료</button>
    <div id="workResults"></div>
  </section>

  <section id="searchArea" class="hidden">
    <div class="searchBox">
      <div class="searchRow">
        <select id="searchModeSelect" onchange="setSearchMode(this.value)">
          <option value="product">정확 검색</option><option value="smart">스마트 검색</option><option value="box">박스번호</option>
        </select>
        <input id="q" type="search" placeholder="상품명을 입력하세요" autocomplete="off">
        <button class="clearBtn" onclick="clearSearch()">초기화</button>
      </div>
      <div id="smartHint" class="smartHint hidden">오타·띄어쓰기·비슷한 표현까지 찾아 점수순으로 보여줍니다. 외부 AI API를 호출하지 않아 검색 비용이 들지 않습니다.</div>
      <div class="actionRow">
        <button class="detailSearchBtn" id="detailToggleBtn" onclick="toggleDetail()">세부검색 펼치기</button>
        <button class="downloadBtn" onclick="downloadExcel()">가격 인하 요청서 엑셀 다운로드</button>
      </div>
      <div id="detailArea" class="hidden">
        <div class="quickRow">
          <button id="allBtn" class="active" onclick="setQuickDate('all')">전체</button>

          <button id="yesterdayBtn" onclick="setQuickDate('yesterday')">어제</button>
          <button id="recentBtn" onclick="setQuickDate('recent7')">최근7일</button>
        </div>
        <div class="dateGrid">
          <div><label>시작 입고일</label><input id="dateStart" type="date"></div>
          <div><label>종료 입고일</label><input id="dateEnd" type="date"></div>
        </div>
      </div>
    </div>
    <div class="chips">
      <button class="chip active" data-menu="전체상품">전체</button>
      <button class="chip" data-menu="유통기한관리">유통기한</button>
      <button class="chip" data-menu="만료">만료</button>
      <button class="chip" data-menu="7일이내">7일</button>
      <button class="chip" data-menu="30일이내">30일</button>
      <button class="chip" data-menu="60일이내">2개월</button>
      <button class="chip" data-menu="90일이내">3개월</button>
      <button class="chip" data-menu="180일이내">6개월</button>
      <button class="chip" data-menu="장기재고">장기</button>
      <button class="chip" data-menu="기한확인필요">기한확인</button>
      <button class="chip" data-menu="비관리대상">비관리</button>
    </div>
    <div id="count" class="count"></div><div id="results"></div>
  </section>
</main>

<nav class="bottomNav"><div class="bottomInner">
  <button id="navWork" class="navBtn active" onclick="setMainMode('work')"><span>⌂</span>작업</button>
  <button id="navSearch" class="navBtn" onclick="setMainMode('search')"><span>⌕</span>검색</button>
  <button class="navBtn" onclick="downloadExcel()"><span>⇩</span>다운로드</button>
  <button class="navBtn" onclick="syncData()"><span>↻</span>동기화</button>
</div></nav>

<script>
const STORES=["영등포","서원","양재","당산","상계","수서","가양","석촌","강남","마곡","신대방3","가락","먹골","흑석","노원","녹번","왕십리","부평","하계","평택안중","대구","수원","갈산","답십리","선유도","석계","성남태평","인천논현","구로구청"];
let RAW_DATA=[],DATA=[],META={},STORE_OVERRIDES={},mainMode="work",searchMode="product",currentMenu="전체상품",timer=null,boxInputTimer=null,visibleLimit=150,currentWorkDate="",currentOpenBox="";
const OFFLINE_DB_NAME="price-search-offline-v1",OFFLINE_DB_STORE="snapshots",OFFLINE_DATA_KEY="latest";
let USING_OFFLINE_CACHE=false,SERVER_UNSTABLE=false;
const OFFLINE_ITEM_FIELDS=["manage","section","category","majorCategory","product","price","priceBand","priceRaw","priceType","priceDisplay","priceAmounts","showPriceDetail","inboundDate","expiryDate","daysLeft","note","barcode","boxNo","type","store","exceptionMode","itemKey","overrideKey","overrideMemo"];

function pad(n){return String(n).padStart(2,"0")}function dateStr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function today(){return dateStr(new Date())}
function yesterday(){let d=new Date();d.setDate(d.getDate()-1);return dateStr(d)}function recent7(){let d=new Date();d.setDate(d.getDate()-6);return dateStr(d)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function norm(s){return String(s??"").toLowerCase().trim()}function won(n){return (!n||isNaN(n))?"":Number(n).toLocaleString()+"원"}
function normalizeBox(v){
  let text=String(v??"").trim();

  // 모바일 숫자 키보드에서 들어올 수 있는 전각 숫자를 반각 숫자로 변환
  text=text.replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));

  // 일반 숫자 또는 57.0 형태
  if(/^\d+(?:\.0+)?$/.test(text)){
    return String(parseInt(text,10));
  }

  // '57번', '박스 57', 'BOX 57' 형태
  const matched=text.match(/(?:box|박스)?\s*0*(\d+)\s*번?/i);
  if(matched){
    return String(parseInt(matched[1],10));
  }

  return text;
}

function openOfflineDB(){
  return new Promise((resolve,reject)=>{
    if(!("indexedDB" in window))return reject(new Error("IndexedDB 미지원"));
    const req=indexedDB.open(OFFLINE_DB_NAME,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(OFFLINE_DB_STORE))db.createObjectStore(OFFLINE_DB_STORE,{keyPath:"key"});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("오프라인 저장소 열기 실패"));
  });
}
function rebuildOfflineSearch(item){
  return [item.inboundDate,item.majorCategory,item.category,item.product,item.priceRaw,item.priceDisplay,item.expiryDate,item.note,item.barcode,item.boxNo,item.store,item.type,item.exceptionMode,item.overrideMemo].filter(Boolean).join(" ").toLowerCase();
}
function sanitizeOfflinePayload(payload){
  const items=(payload.items||[]).map(source=>{
    const item={};
    OFFLINE_ITEM_FIELDS.forEach(key=>{if(source[key]!==undefined)item[key]=source[key]});
    item.search=rebuildOfflineSearch(item);
    return item;
  });
  return {
    updatedAt:String(payload.updatedAt||""),
    count:items.length,
    loadedSheets:Array.isArray(payload.loadedSheets)?payload.loadedSheets:[],
    failedSheets:Array.isArray(payload.failedSheets)?payload.failedSheets:[],
    items
  };
}
async function saveOfflineSnapshot(payload){
  const safePayload=sanitizeOfflinePayload(payload);
  const savedAt=new Date().toISOString();
  try{
    const db=await openOfflineDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(OFFLINE_DB_STORE,"readwrite");
      tx.objectStore(OFFLINE_DB_STORE).put({key:OFFLINE_DATA_KEY,savedAt,payload:safePayload});
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error("오프라인 자료 저장 실패"));
    });
    db.close();
    localStorage.setItem("offlineCacheSavedAt",savedAt);
    return true;
  }catch(e){
    console.warn("오프라인 저장 실패",e);
    return false;
  }
}
async function readOfflineSnapshot(){
  try{
    const db=await openOfflineDB();
    const record=await new Promise((resolve,reject)=>{
      const tx=db.transaction(OFFLINE_DB_STORE,"readonly");
      const req=tx.objectStore(OFFLINE_DB_STORE).get(OFFLINE_DATA_KEY);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error||new Error("오프라인 자료 읽기 실패"));
    });
    db.close();
    return record;
  }catch(e){
    return null;
  }
}
async function clearOfflineData(){
  if(!confirm("이 휴대폰에 저장된 오프라인 가격자료를 삭제할까요?"))return;
  try{
    const db=await openOfflineDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(OFFLINE_DB_STORE,"readwrite");
      tx.objectStore(OFFLINE_DB_STORE).delete(OFFLINE_DATA_KEY);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error("삭제 실패"));
    });
    db.close();
  }catch(e){}
  Object.keys(localStorage).filter(k=>k.startsWith("offlineOverrides:")).forEach(k=>localStorage.removeItem(k));
  localStorage.removeItem("offlineCacheSavedAt");
  try{
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(key=>key.includes("-data")).map(key=>caches.delete(key)));
    }
  }catch(e){}
  updateNetworkStatus();
  alert("오프라인 저장자료를 삭제했습니다. 현재 열린 화면은 앱을 새로고침할 때까지 유지됩니다.");
}
function formatCacheTime(value){
  if(!value)return "저장자료 없음";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return value;
  return d.toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function updateNetworkStatus(){
  const bar=document.getElementById("networkBar"),text=document.getElementById("networkText"),sync=document.getElementById("syncBtn");
  if(!bar||!text)return;
  const saved=formatCacheTime(localStorage.getItem("offlineCacheSavedAt")||"");
  bar.classList.remove("offline","unstable");
  if(!navigator.onLine){
    bar.classList.add("offline");
    text.innerHTML=`오프라인 작업모드 · 마지막 저장 ${esc(saved)}`;
    if(sync){sync.disabled=true;sync.innerText="오프라인"}
  }else if(SERVER_UNSTABLE||USING_OFFLINE_CACHE){
    bar.classList.add("unstable");
    text.innerHTML=`서버 연결 불안정 · 저장자료 사용 중 (${esc(saved)})`;
    if(sync){sync.disabled=false;sync.innerText="재연결"}
  }else{
    text.innerHTML=`온라인 연결됨 · 오프라인 자료 ${esc(saved)}`;

  }
}

async function loadOverrides(){
  STORE_OVERRIDES={};
  const store=getStore();
  if(!store){DATA=RAW_DATA.slice();return}
  const cacheKey=`offlineOverrides:${store}`;
  try{
    if(!navigator.onLine)throw new Error("offline");
    const r=await fetch(`/store_overrides/${encodeURIComponent(store)}?ts=`+Date.now(),{cache:"no-store"});
    const j=await r.json();
    if(j.ok){
      STORE_OVERRIDES=j.overrides||{};
      localStorage.setItem(cacheKey,JSON.stringify({savedAt:new Date().toISOString(),overrides:STORE_OVERRIDES}));
    }
  }catch(e){
    try{STORE_OVERRIDES=(JSON.parse(localStorage.getItem(cacheKey)||"{}").overrides)||{}}catch(_){STORE_OVERRIDES={}}
  }
  DATA=RAW_DATA.map(item=>{
    const o=STORE_OVERRIDES[item.itemKey];
    if(!o)return item;
    const x={...item,storeOverride:true};
    if(o.expiryDate)x.expiryDate=o.expiryDate;
    return x
  })
}

const COMPLETED_BOX_STORAGE_KEY="completedWorkBoxesV1";

function completedBoxKey(date,boxNo){
  const store=getStore()||"지점미선택";
  return [store,String(date||""),normalizeBox(boxNo)].join("|||");
}

function loadCompletedBoxKeys(){
  try{
    const saved=JSON.parse(localStorage.getItem(COMPLETED_BOX_STORAGE_KEY)||"[]");
    return new Set(Array.isArray(saved)?saved:[]);
  }catch(e){
    return new Set();
  }
}

function saveCompletedBoxKeys(keys){
  localStorage.setItem(COMPLETED_BOX_STORAGE_KEY,JSON.stringify([...keys]));
}

function isBoxCompleted(date,boxNo){
  return loadCompletedBoxKeys().has(completedBoxKey(date,boxNo));
}

function setBoxCompleted(date,boxNo,completed){
  const keys=loadCompletedBoxKeys();
  const key=completedBoxKey(date,boxNo);

  if(completed)keys.add(key);
  else keys.delete(key);

  saveCompletedBoxKeys(keys);
}

function resetCompletedBoxes(){
  if(!currentWorkDate)return;

  const store=getStore()||"지점미선택";
  const prefix=[store,currentWorkDate,""].join("|||");

  if(!confirm(`${currentWorkDate}의 박스 완료표시를 모두 초기화할까요?`))return;

  const keys=loadCompletedBoxKeys();
  [...keys].forEach(key=>{
    if(key.startsWith(prefix))keys.delete(key);
  });
  saveCompletedBoxKeys(keys);

  renderBoxes();

  if(currentOpenBox){
    const rows=workRows().filter(item=>normalizeBox(item.boxNo)===currentOpenBox);
    updateBoxCompleteButton(rows.length>0);
  }
}

function updateBoxCompleteButton(hasProducts=true){
  const button=document.getElementById("boxCompleteBtn");
  if(!button)return;

  if(!currentOpenBox || !hasProducts){
    button.disabled=true;
    button.classList.remove("completed");
    button.textContent="상품이 없는 박스입니다";
    return;
  }

  const completed=isBoxCompleted(currentWorkDate,currentOpenBox);
  button.disabled=false;
  button.classList.toggle("completed",completed);
  button.textContent=completed
    ?"✓ 작업 완료됨 · 누르면 취소"
    :"✓ 이 박스 작업 완료";
}

function toggleCurrentBoxComplete(){
  if(!currentOpenBox)return;

  const rows=workRows().filter(item=>normalizeBox(item.boxNo)===currentOpenBox);
  if(!rows.length)return;

  const next=!isBoxCompleted(currentWorkDate,currentOpenBox);
  setBoxCompleted(currentWorkDate,currentOpenBox,next);
  updateBoxCompleteButton(true);

  // 뒤에 숨겨진 박스 선택 화면의 완료 표시와 진행률도 즉시 갱신한다.
  renderBoxes();
}

function availableWorkDates(){
  return [...new Set(
    DATA.map(item=>String(item.inboundDate||"").trim()).filter(Boolean)
  )].sort((a,b)=>b.localeCompare(a));
}

function workDateLabel(date){
  if(date===today())return `${date} (오늘)`;
  if(date===yesterday())return `${date} (어제)`;
  return date;
}

function populateWorkDateSelect(preferredDate=""){
  const select=document.getElementById("workDateSelect");
  const dates=availableWorkDates();

  if(!dates.length){
    currentWorkDate="";
    select.innerHTML='<option value="">입고 날짜 없음</option>';
    select.disabled=true;
    localStorage.removeItem("selectedWorkDate");
    return;
  }

  select.disabled=false;

  const saved=localStorage.getItem("selectedWorkDate")||"";
  let selected=preferredDate;

  if(!dates.includes(selected)){
    if(dates.includes(saved))selected=saved;
    else if(dates.includes(today()))selected=today();
    else selected=dates[0];
  }

  const countByDate={};
  DATA.forEach(item=>{
    const date=String(item.inboundDate||"").trim();
    if(date)countByDate[date]=(countByDate[date]||0)+1;
  });

  select.innerHTML=dates.map(date=>
    `<option value="${esc(date)}">${esc(workDateLabel(date))} · ${(countByDate[date]||0).toLocaleString()}개</option>`
  ).join("");

  select.value=selected;
  currentWorkDate=selected;
  localStorage.setItem("selectedWorkDate",selected);
}

function changeWorkDate(date){
  const dates=availableWorkDates();
  if(!dates.includes(date))return;

  currentWorkDate=date;
  currentOpenBox="";
  localStorage.setItem("selectedWorkDate",date);

  clearTimeout(boxInputTimer);
  document.getElementById("workBoxInput").value="";
  document.getElementById("workList").classList.add("hidden");
  document.getElementById("workHome").classList.remove("hidden");

  renderBoxes();
}

function selectTodayWorkDate(){
  const dates=availableWorkDates();

  if(!dates.includes(today())){
    alert("오늘 날짜의 가격리스트가 없습니다.");
    return;
  }

  const select=document.getElementById("workDateSelect");
  select.value=today();
  changeWorkDate(today());
}

function workRows(){
  const dates=availableWorkDates();

  if(!currentWorkDate || !dates.includes(currentWorkDate)){
    populateWorkDateSelect(currentWorkDate);
  }

  return DATA.filter(item=>item.inboundDate===currentWorkDate);
}
function renderBoxes(){
  populateWorkDateSelect(currentWorkDate);
  const rows=workRows();

  const dateNote=currentWorkDate===today()
    ?"오늘"
    :(currentWorkDate===yesterday()?"어제":"선택 날짜");

  document.getElementById("workDate").innerText=currentWorkDate
    ?`${currentWorkDate} · ${dateNote} 가격리스트`
    :"입고 데이터 없음";

  const detected=rows
    .map(x=>Number(normalizeBox(x.boxNo)))
    .filter(x=>Number.isInteger(x)&&x>0);

  const detectedMax=detected.length?Math.max(...detected):0;
  const savedMax=Number(localStorage.getItem("workMaxBoxNo")||57);
  const maxBox=Math.max(57,savedMax,detectedMax);

  if(detectedMax>savedMax){
    localStorage.setItem("workMaxBoxNo",String(detectedMax));
  }

  const available=new Set(detected.map(String));
  const completedCount=[...available].filter(boxNo=>
    isBoxCompleted(currentWorkDate,boxNo)
  ).length;
  const totalCount=available.size;
  const percent=totalCount?Math.round((completedCount/totalCount)*100):0;

  document.getElementById("workProgressText").innerText=
    `완료 ${completedCount} / ${totalCount}박스 · ${percent}%`;
  document.getElementById("workProgressFill").style.width=`${percent}%`;

  const buttons=[];
  for(let n=1;n<=maxBox;n++){
    const exists=available.has(String(n));
    const completed=exists&&isBoxCompleted(currentWorkDate,String(n));

    buttons.push(
      `<button class="boxBtn${exists?"":" missing"}${completed?" completed":""}"
        style="${exists?"":"opacity:.55"}"
        onclick="openBox('${n}')">
        <span>${n}</span>
        ${completed?'<span class="boxDoneMark">✓ 완료</span>':""}
      </button>`
    );
  }
  document.getElementById("boxGrid").innerHTML=buttons.join("");
}


function scheduleBoxJump(){
  clearTimeout(boxInputTimer);

  const input=document.getElementById("workBoxInput");
  const raw=String(input.value??"").trim();

  // 입력 중에는 안내창을 띄우지 않는다.
  if(raw===""){
    return;
  }

  boxInputTimer=setTimeout(()=>{
    const value=normalizeBox(input.value);

    if(value!=="" && Number.isInteger(Number(value)) && Number(value)>=1){
      input.value=String(Number(value));
      input.blur();
      openBox(String(Number(value)));
    }
  },350);
}

function jumpToBox(){
  const input=document.getElementById("workBoxInput");
  const raw=String(input.value??"").trim();
  const value=normalizeBox(raw);

  if(value==="" || !Number.isInteger(Number(value)) || Number(value)<1){
    alert("박스번호를 숫자로 입력해 주세요.");
    input.focus();
    return;
  }

  input.value=String(Number(value));
  openBox(String(Number(value)));
}

function openBox(n){
  const normalized=normalizeBox(n);
  currentOpenBox=normalized;
  const recentRaw=JSON.parse(localStorage.getItem("recentWorkBoxes")||"[]");
  const recent=recentRaw.filter(item=>
    !(String(item.date||"")===currentWorkDate && normalizeBox(item.box)===normalized)
  );

  recent.unshift({date:currentWorkDate,box:normalized});
  localStorage.setItem("recentWorkBoxes",JSON.stringify(recent.slice(0,8)));

  const rows=workRows().filter(item=>normalizeBox(item.boxNo)===normalized);

  document.getElementById("workHome").classList.add("hidden");
  document.getElementById("workList").classList.remove("hidden");
  document.getElementById("boxTitle").innerText=`${normalized}번 박스`;
  document.getElementById("boxCount").innerText=`${currentWorkDate} · 총 ${rows.length}개 상품`;
  updateBoxCompleteButton(rows.length>0);
  renderWork(rows);
}

function showRecentBox(){
  let recent=JSON.parse(localStorage.getItem("recentWorkBoxes")||"[]");

  // 이전 버전의 최근 박스 기록도 호환한다.
  if(!recent.length){
    const oldRecent=JSON.parse(localStorage.getItem("recentBoxes")||"[]");
    if(oldRecent.length){
      recent=[{date:currentWorkDate,box:oldRecent[0]}];
    }
  }

  if(!recent.length){
    alert("최근 본 박스가 없습니다.");
    return;
  }

  const item=recent[0];
  const dates=availableWorkDates();

  if(item.date && dates.includes(item.date)){
    const select=document.getElementById("workDateSelect");
    select.value=item.date;
    currentWorkDate=item.date;
    localStorage.setItem("selectedWorkDate",item.date);
  }

  openBox(item.box);
}

function similarity(a,b){const aa=compactText(a),bb=compactText(b),maxLen=Math.max(aa.length,bb.length);return maxLen?1-(levenshtein(aa,bb)/maxLen):1}
function scoreSmartItem(item,query){const product=smartNormalize(item.product||""),productCompact=compactText(item.product||""),search=smartNormalize(item.search||""),searchCompact=compactText(item.search||""),original=smartNormalize(query),originalCompact=compactText(query),tokens=smartTokens(query);let score=0;const reasons=[];if(product===original){score+=120;reasons.push("상품명 정확 일치")}if(productCompact===originalCompact){score+=110;reasons.push("띄어쓰기 무시 일치")}if(product.startsWith(original)&&original){score+=85;reasons.push("상품명 앞부분 일치")}if(product.includes(original)&&original){score+=75;reasons.push("상품명 포함")}if(productCompact.includes(originalCompact)&&originalCompact){score+=72;reasons.push("붙여쓰기 일치")}for(const token of tokens){const tc=compactText(token);if(!tc)continue;if(product.includes(token)){score+=34;reasons.push(`상품명: ${token}`)}else if(productCompact.includes(tc)){score+=30;reasons.push(`유사어: ${token}`)}else if(search.includes(token)||searchCompact.includes(tc)){score+=18;reasons.push(`검색어 연결: ${token}`)}}for(const qw of original.split(/\s+/).filter(Boolean)){if(qw.length<2)continue;let best=0;for(const pw of product.split(/\s+/).filter(Boolean)){if(Math.abs(pw.length-qw.length)>2)continue;best=Math.max(best,similarity(qw,pw))}if(best>=.82){score+=26;reasons.push("오타 유사")}else if(best>=.68)score+=12}return {score,reasons:[...new Set(reasons)].slice(0,3)}}

function passMenu(i){if(currentMenu==="전체상품")return true;if(currentMenu==="유통기한관리")return i.manage==="유통기한관리";if(currentMenu==="기한확인필요")return i.manage==="기한확인필요";if(currentMenu==="비관리대상")return i.manage==="비관리대상";return i.section===currentMenu}
function scheduleSearch(){clearTimeout(timer);timer=setTimeout(search,180)}
function search(){
  const raw=document.getElementById("q").value.trim(),q=norm(raw),s=document.getElementById("dateStart").value,e=document.getElementById("dateEnd").value;
  let rows=DATA.filter(passMenu);
  if(s)rows=rows.filter(x=>(x.inboundDate||"")>=s);
  if(e)rows=rows.filter(x=>(x.inboundDate||"")<=e);
  if(searchMode==="box"){
    if(raw)rows=rows.filter(x=>String(x.boxNo||"").trim()===raw);
  }else if(searchMode==="smart"){
    if(raw)rows=rows.map(item=>{const result=scoreSmartItem(item,raw);return {...item,_smartScore:result.score,_smartReasons:result.reasons}}).filter(item=>item._smartScore>=18).sort((a,b)=>b._smartScore-a._smartScore);
  }else{
    const ts=q.split(/\s+/).filter(Boolean);
    if(ts.length)rows=rows.filter(x=>ts.every(t=>norm(x.search||"").includes(t)));
  }
  renderSearch(rows);
}
function renderSearch(rows){document.getElementById("count").innerHTML=`검색 결과 <b>${rows.length.toLocaleString()}</b>건`;const root=document.getElementById("results");if(!rows.length){root.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}root.innerHTML=rows.slice(0,visibleLimit).map((i,k)=>`<article class="card"><div class="name">${esc(i.product||"")}${searchMode==="smart"&&i._smartScore?`<span class="scoreBadge">일치도 ${Math.min(100,Math.round(i._smartScore))}</span>`:""}</div><div class="price">${esc(priceText(i))}</div>${searchMode==="smart"&&i._smartReasons?.length?`<div class="smartHint" style="margin:8px 0 0">검색 연결: ${esc(i._smartReasons.join(" · "))}</div>`:""}<div class="badges"><span class="badge">${esc(i.inboundDate||"-")}</span><span class="badge">박스 ${esc(i.boxNo||"-")}</span>${i.expiryDate?`<span class="badge warn">${esc(i.expiryDate)}</span>`:""}</div>${i.showPriceDetail&&i.priceRaw?`<div class="priceRaw">${esc(i.priceRaw)}</div>`:""}<div class="expiryEdit"><input id="ex${k}" type="date" value="${esc(i.expiryDate||"")}"><button onclick="saveExpiry('${encodeURIComponent(i.itemKey)}','ex${k}')">저장</button></div><div class="exceptionBtns"><button class="manufacture" onclick="setException('${encodeURIComponent(i.itemKey)}','manufacture')">제조일</button><button class="exclude" onclick="setException('${encodeURIComponent(i.itemKey)}','exclude')">관리제외</button><button class="expiry" onclick="setException('${encodeURIComponent(i.itemKey)}','expiry')">유통기한</button></div></article>`).join("");if(rows.length>visibleLimit)root.insertAdjacentHTML("beforeend",'<button class="secondaryBtn" onclick="visibleLimit+=150;search()">더보기</button>')}
async function saveExpiry(key,id){if(!requireOnline("유통기한 저장은 온라인 연결 후 사용할 수 있습니다."))return;const store=getStore();if(!store)return alert("상단에서 내 매장을 선택해 주세요.");const value=document.getElementById(id).value;if(!value)return alert("유통기한을 선택해 주세요.");const r=await fetch(`/set_store_item_expiry/${key}/${encodeURIComponent(store)}/${value}?ts=`+Date.now()),j=await r.json();if(!j.ok)return alert(j.message||"저장 실패");await loadData({autoRecover:false});alert("저장 완료")}
async function setException(key,mode){if(!requireOnline("관리방식 변경은 온라인 연결 후 사용할 수 있습니다."))return;const store=getStore();if(!store)return alert("상단에서 내 매장을 선택해 주세요.");const r=await fetch(`/set_item_exception/STORE%7C${encodeURIComponent(store)}%7C${key}/${mode}?ts=`+Date.now()),j=await r.json();if(!j.ok)return alert(j.message||"설정 실패");await loadData({autoRecover:false});alert("설정 완료")}
function downloadExcel(){if(!requireOnline("엑셀 다운로드는 온라인 연결 후 사용할 수 있습니다."))return;const p=new URLSearchParams({mode:searchMode,q:document.getElementById("q").value||"",start:document.getElementById("dateStart").value||"",end:document.getElementById("dateEnd").value||"",menu:currentMenu,store:getStore()});location.href="/download_excel?"+p}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function fetchData(){
  let networkError=null;
  if(navigator.onLine){
    try{
      const r=await fetch("search_data.json?ts="+Date.now(),{cache:"no-store"});
      if(!r.ok)throw new Error(`데이터 요청 실패 (${r.status})`);
      const d=await r.json();
      if(!d||!Array.isArray(d.items))throw new Error("데이터 형식 오류");
      await saveOfflineSnapshot(d);
      USING_OFFLINE_CACHE=false;
      SERVER_UNSTABLE=false;
      return d;
    }catch(e){networkError=e;SERVER_UNSTABLE=true}
  }

  const cached=await readOfflineSnapshot();
  if(cached&&cached.payload&&Array.isArray(cached.payload.items)){
    USING_OFFLINE_CACHE=true;
    localStorage.setItem("offlineCacheSavedAt",cached.savedAt||localStorage.getItem("offlineCacheSavedAt")||"");
    return cached.payload;
  }

  throw networkError||new Error("저장된 오프라인 가격자료가 없습니다. 인터넷이 연결된 상태에서 한 번 동기화해 주세요.");
}
async function loadData(opt={}){
  let err;
  const tries=navigator.onLine?3:1;
  for(let n=1;n<=tries;n++){
    try{
      if(n>1)document.getElementById("status").innerHTML=`서버 준비 중... ${n}/${tries}`;
      const d=await fetchData();
      META=d;RAW_DATA=d.items||[];
      await loadOverrides();
      updateStatus();renderBoxes();search();
      return true
    }catch(e){err=e;if(n<tries)await sleep(n*1000)}
  }
  if(opt.autoRecover!==false&&navigator.onLine){
    const ok=await syncData({silent:true,reloadAfter:false});
    if(ok)return loadData({autoRecover:false})
  }
  document.getElementById("status").innerHTML=`데이터 불러오기 실패: ${esc(err?.message||"오류")}`;
  updateNetworkStatus();
  return false
}
async function syncData(opt={}){
  if(!navigator.onLine){
    updateNetworkStatus();
    if(!opt.silent)alert("현재 오프라인입니다. 저장된 가격자료로 조회는 가능하지만 동기화는 할 수 없습니다.");
    return false
  }
  const b=document.getElementById("syncBtn");b.disabled=true;b.innerText="동기화중";
  try{
    const r=await fetch("/sync?ts="+Date.now(),{cache:"no-store"}),j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.message||"동기화 실패");
    localStorage.setItem("lastSuccessfulSyncDate",today());
    SERVER_UNSTABLE=false;USING_OFFLINE_CACHE=false;
    if(opt.reloadAfter!==false)await loadData({autoRecover:false});
    updateNetworkStatus();
    return true
  }catch(e){
    SERVER_UNSTABLE=true;updateNetworkStatus();
    if(!opt.silent)alert(e.message||String(e));
    return false
  }finally{
    b.disabled=false;
    updateNetworkStatus()
  }
}

function removeLegacyOriginalButtons(){
  document.querySelectorAll("button,a").forEach(element=>{
    const text=(element.textContent||"").replace(/\s+/g," ").trim();
    const action=(element.getAttribute("onclick")||"").trim();

    if(
      text.includes("원본 가격리스트") ||
      text.includes("원본 보기") ||
      action.includes("openOriginal")
    ){
      element.remove();
    }
  });
}

async function registerServiceWorker(){
  if(!("serviceWorker" in navigator))return;

  try{
    let reloading=false;

    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(reloading)return;
      reloading=true;

      if(sessionStorage.getItem("swV32Reloaded")!=="1"){
        sessionStorage.setItem("swV32Reloaded","1");
        window.location.reload();
      }
    });

    const registration=await navigator.serviceWorker.register(
      "/service-worker.js",
      {scope:"/",updateViaCache:"none"}
    );

    await registration.update();
  }catch(e){
    console.warn("서비스워커 등록 실패",e);
  }
}
async function handleOnline(){
  SERVER_UNSTABLE=false;USING_OFFLINE_CACHE=false;updateNetworkStatus();
  setTimeout(()=>loadData({autoRecover:false}),500)
}
function handleOffline(){updateNetworkStatus()}
async function start(){
  removeLegacyOriginalButtons();
  await registerServiceWorker();
  removeLegacyOriginalButtons();
  window.addEventListener("online",handleOnline);
  window.addEventListener("offline",handleOffline);
  initStore();updateNetworkStatus();
  if(navigator.onLine&&(localStorage.getItem("lastSuccessfulSyncDate")||"")!==today())await syncData({silent:true,reloadAfter:false});
  await loadData()
}
